<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BuildMitra DRG V4 Proof</title>

<style>
body {
 font-family: Arial, sans-serif;
 margin: 0;
 background: #f1f5f9;
 color: #0f172a;
}

header {
 background: white;
 padding: 18px;
 text-align: center;
 border-bottom: 1px solid #cbd5e1;
}

.grid {
 display: grid;
 grid-template-columns:
   repeat(auto-fit,minmax(600px,1fr));
 gap: 16px;
 padding: 16px;
}

.card {
 background: white;
 border-radius: 12px;
 padding: 12px;
 box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

object {
 display: block;
 width: 100%;
 min-height: 850px;
 border: 1px solid #e2e8f0;
}

.pass {
 color: #166534;
 font-weight: 800;
}

.fail {
 color: #b91c1c;
 font-weight: 800;
}
</style>
</head>

<body>

<header>
<h1>BuildMitra DRG V4 — Standalone Acceptance Proof</h1>

<p>
30×40 • South Facing • G+2 • Half Parking
</p>

<p class="fail">
Geometry QA:
REVIEW
</p>

</header>

<div class="grid">

<section class="card">
 <h2>GROUND FLOOR</h2>
 <object
   data="floor_0_ground_floor.svg"
   type="image/svg+xml">
 </object>
</section>

<section class="card">
 <h2>FIRST FLOOR</h2>
 <object
   data="floor_1_first_floor.svg"
   type="image/svg+xml">
 </object>
</section>

<section class="card">
 <h2>SECOND FLOOR</h2>
 <object
   data="floor_2_second_floor.svg"
   type="image/svg+xml">
 </object>
</section>

</div>

</body>
</html>
